{{HEAD_EXTRA}}
    <link rel="preload" href="/fonts/XCharter-Roman.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/XCharter-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/styles.css">

    <script>
      // Apply the saved theme before first paint (prevents a flash) and mark JS on.
      (function () {
        var e = document.documentElement;
        e.classList.add('js');
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') e.setAttribute('data-theme', t);
        } catch (err) {}
      })();
    </script>
</head>
